# Copy this file to the CONTENT repo as .github/workflows/content-preview.yml (steps: docs/PREVIEW.md,
# "Content repo: private previews and publishing").
#
# For every ready pull request in the content repo it builds the site with that PR's content and publishes it
# to a SEPARATE Cloudflare Pages project that sits behind Cloudflare Access, so drafts are never public.
# Order matters: a content-free probe page goes up first and must be turned away when signed out; only then does
# the real preview go up, and it is checked again. The job is the blocking check "private-preview": make it
# required in the content repo's branch rule. The job is skipped for draft PRs (nothing is published for them);
# a skipped required check counts as passed, so only ever merge a PR that is ready for review. Unlike the site repo, a missing set-up FAILS (never skipped).
name: Content preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: content-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  PROJECT: ${{ vars.PREVIEW_PROJECT || 'ag-content-preview' }}
  SITE_REPO: ildruido/ag-website
  BRANCH: pr-${{ github.event.pull_request.number }}

jobs:
  private-preview:
    if: github.event.pull_request.draft != true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cloudflare set up?
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing in this repo's secrets, so the preview cannot be checked. See docs/PREVIEW.md in the site repo."
            exit 1
          fi

      - name: Content (this pull request)
        uses: actions/checkout@v4
        with:
          path: content

      - name: Site code (public repo, latest main)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SITE_REPO }}
          ref: main
          path: site

      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install the site's tools
        working-directory: site
        run: npm ci

      - name: Find the preview address
        id: addr
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create "$PROJECT" --production-branch main >/dev/null 2>&1 || true
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" \
            | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).result.subdomain")
          echo "url=https://${BRANCH}.${sub}" >> "$GITHUB_OUTPUT"

      - name: Put up a probe page (no content) and check it is private
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p ../probe
          printf '<!doctype html><title>probe</title><p>probe</p>' > ../probe/index.html
          npx wrangler pages deploy ../probe --project-name "$PROJECT" --branch "$BRANCH" --commit-dirty=true
          npx tsx scripts/preview-privacy-check.ts "${{ steps.addr.outputs.url }}"

      - name: Build the site with this content
        working-directory: site
        env:
          SITE_URL: ${{ steps.addr.outputs.url }}
          CONTENT_DIR: ../content
        run: |
          npm run build
          printf '\n/*\n  X-Robots-Tag: noindex, nofollow\n' >> dist/_headers

      - name: Publish the preview
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name "$PROJECT" --branch "$BRANCH" --commit-dirty=true

      - name: Check again that it is private
        id: recheck
        working-directory: site
        run: npx tsx scripts/preview-privacy-check.ts "${{ steps.addr.outputs.url }}"

      - name: Take the content down if that check failed
        if: failure() && steps.recheck.outcome == 'failure'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy ../probe --project-name "$PROJECT" --branch "$BRANCH" --commit-dirty=true

      - name: Post the link on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "Private preview (sign in with your Cloudflare Access email): ${{ steps.addr.outputs.url }}/en/"
